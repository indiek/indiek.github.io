title: "IndieK"
tagline: "Knowledge graphs, archived to last"
description: >-
  IndieK is an open archival format for knowledge graphs — signed, append-only,
  verifiable without any software — with a Python SDK and the ik command-line tool.
baseurl: ""
url: "https://indiek.org"
permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
highlighter: rouge
plugins: []

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - README.md
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - scripts/
